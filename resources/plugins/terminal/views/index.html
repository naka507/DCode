<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>Terminal</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121316;
        --surface: #18191d;
        --surface-hover: #22242a;
        --fg: #e2e8f0;
        --muted: #8492a6;
        --faint: #475569;
        --border: rgba(255, 255, 255, 0.08);
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.12);
        --success: #34d399;
        --error: #f87171;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --fg: #1e293b;
        --muted: #64748b;
        --faint: #94a3b8;
        --border: rgba(0, 0, 0, 0.08);
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.1);
        --success: #059669;
        --error: #dc2626;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: 13px;
        overflow: hidden;
      }
      body {
        padding-top: var(--pi-plugin-titlebar-height, 0px);
        display: flex;
        flex-direction: column;
      }
      .term-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        gap: 8px;
      }
      .term-info {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        overflow: hidden;
      }
      .term-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
        text-transform: uppercase;
      }
      .term-status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .term-status-dot.is-running {
        background: var(--success);
        box-shadow: 0 0 6px var(--success);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .term-cwd {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .term-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      .term-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--fg);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: background 0.15s;
      }
      .term-btn:hover:not(:disabled) {
        background: var(--surface-hover);
      }
      .term-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .term-btn.is-danger {
        color: var(--error);
      }
      .term-quick-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        white-space: nowrap;
      }
      .term-pill {
        background: var(--surface-hover);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 2px 7px;
        border-radius: 999px;
        font-family: var(--font-mono);
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
      }
      .term-pill:hover {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: var(--accent);
      }
      .term-body {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .term-line-cmd {
        color: var(--accent);
        font-weight: 600;
        margin-top: 10px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .term-line-cmd:first-child {
        margin-block-start: 0;
      }
      .term-line-cmd .prompt-sym {
        color: var(--muted);
      }
      .term-line-cmd .cmd-time {
        margin-left: auto;
        font-size: 10px;
        color: var(--faint);
        font-weight: normal;
      }
      .term-line-stdout {
        color: var(--fg);
      }
      .term-line-stderr {
        color: var(--error);
      }
      .term-exit-badge {
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        margin-top: 4px;
        display: inline-block;
      }
      .term-exit-badge.is-ok {
        background: rgba(52, 211, 153, 0.15);
        color: var(--success);
      }
      .term-exit-badge.is-err {
        background: rgba(248, 113, 113, 0.15);
        color: var(--error);
      }
      .term-prompt-box {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        gap: 8px;
      }
      .term-prompt-prefix {
        color: var(--accent);
        font-family: var(--font-mono);
        font-weight: bold;
      }
      .term-input {
        flex: 1;
        background: transparent;
        border: 0;
        color: var(--fg);
        font-family: var(--font-mono);
        font-size: 12px;
        outline: none;
      }
      .term-input::placeholder {
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="term-header">
      <div class="term-info">
        <span id="status-dot" class="term-status-dot"></span>
        <span id="shell-badge" class="term-badge">SHELL</span>
        <span id="cwd-label" class="term-cwd" title="Working directory">...</span>
      </div>
      <div class="term-actions">
        <button id="btn-kill" class="term-btn is-danger" disabled title="Kill running command (Ctrl+C)">Abort</button>
        <button id="btn-clear" class="term-btn" title="Clear terminal (Ctrl+L)">Clear</button>
      </div>
    </div>

    <div class="term-quick-bar">
      <span class="term-pill" data-cmd="git status">git status</span>
      <span class="term-pill" data-cmd="git diff">git diff</span>
      <span class="term-pill" data-cmd="npm test">npm test</span>
      <span class="term-pill" data-cmd="npm run typecheck">typecheck</span>
      <span class="term-pill" data-cmd="dir">dir</span>
    </div>

    <div id="term-output" class="term-body">
      <div style="color: var(--muted); margin-bottom: 8px;">DCode Work Panel Terminal · Ready</div>
    </div>

    <form id="term-form" class="term-prompt-box">
      <span class="term-prompt-prefix">$</span>
      <input
        id="term-input"
        class="term-input"
        type="text"
        placeholder="Type a command and press Enter..."
        autocomplete="off"
        spellcheck="false"
      />
    </form>

    <script>
      (function() {
        const outputEl = document.getElementById("term-output");
        const inputEl = document.getElementById("term-input");
        const formEl = document.getElementById("term-form");
        const cwdLabel = document.getElementById("cwd-label");
        const shellBadge = document.getElementById("shell-badge");
        const statusDot = document.getElementById("status-dot");
        const btnKill = document.getElementById("btn-kill");
        const btnClear = document.getElementById("btn-clear");

        const history = [];
        let historyIndex = -1;
        let isRunning = false;

        async function invoke(channel, payload) {
          if (window.pluginBridge && window.pluginBridge.invoke) {
            return window.pluginBridge.invoke(channel, payload);
          }
          return { ok: false, error: "pluginBridge not found" };
        }

        async function init() {
          const info = await invoke("terminal.info");
          if (info && info.ok) {
            if (info.cwd) cwdLabel.textContent = info.cwd;
            if (info.shell) {
              const name = info.shell.split(/[/\\]/).pop().replace(/\.exe$/i, "");
              shellBadge.textContent = name;
            }
          }
        }

        function setRunning(running) {
          isRunning = running;
          btnKill.disabled = !running;
          if (running) {
            statusDot.classList.add("is-running");
          } else {
            statusDot.classList.remove("is-running");
          }
        }

        function scrollToBottom() {
          outputEl.scrollTop = outputEl.scrollHeight;
        }

        function appendCommand(cmd) {
          const div = document.createElement("div");
          div.className = "term-line-cmd";
          const time = new Date().toLocaleTimeString();
          div.innerHTML = `<span class="prompt-sym">$</span> <span>${escapeHtml(cmd)}</span> <span class="cmd-time">${time}</span>`;
          outputEl.appendChild(div);
          scrollToBottom();
        }

        function appendOutput(text, isErr) {
          if (!text) return;
          const div = document.createElement("div");
          div.className = isErr ? "term-line-stderr" : "term-line-stdout";
          div.textContent = text;
          outputEl.appendChild(div);
          scrollToBottom();
        }

        function appendExit(code, ok) {
          const div = document.createElement("div");
          div.innerHTML = `<span class="term-exit-badge ${ok ? 'is-ok' : 'is-err'}">Process exited with code ${code}</span>`;
          outputEl.appendChild(div);
          scrollToBottom();
        }

        function escapeHtml(str) {
          return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
          }[tag] || tag));
        }

        async function runCommand(cmd) {
          const trimmed = cmd.trim();
          if (!trimmed || isRunning) return;

          history.push(trimmed);
          historyIndex = history.length;

          appendCommand(trimmed);
          setRunning(true);

          try {
            const res = await invoke("terminal.exec", { command: trimmed });
            if (res.stdout) appendOutput(res.stdout, false);
            if (res.stderr) appendOutput(res.stderr, true);
            if (res.error) appendOutput(res.error, true);
            appendExit(res.exitCode ?? 0, res.ok);
          } catch (e) {
            appendOutput(String(e), true);
            appendExit(-1, false);
          } finally {
            setRunning(false);
            inputEl.focus();
          }
        }

        formEl.addEventListener("submit", (e) => {
          e.preventDefault();
          const val = inputEl.value;
          inputEl.value = "";
          runCommand(val);
        });

        inputEl.addEventListener("keydown", (e) => {
          if (e.key === "ArrowUp") {
            e.preventDefault();
            if (history.length > 0 && historyIndex > 0) {
              historyIndex -= 1;
              inputEl.value = history[historyIndex] || "";
            }
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            if (historyIndex < history.length - 1) {
              historyIndex += 1;
              inputEl.value = history[historyIndex] || "";
            } else {
              historyIndex = history.length;
              inputEl.value = "";
            }
          } else if (e.ctrlKey && e.key === "c") {
            if (isRunning) {
              invoke("terminal.kill");
            }
          } else if (e.ctrlKey && e.key === "l") {
            e.preventDefault();
            outputEl.innerHTML = "";
          }
        });

        btnKill.addEventListener("click", () => {
          invoke("terminal.kill");
        });

        btnClear.addEventListener("click", () => {
          outputEl.innerHTML = "";
        });

        document.querySelectorAll(".term-pill").forEach(pill => {
          pill.addEventListener("click", () => {
            const cmd = pill.getAttribute("data-cmd");
            if (cmd) runCommand(cmd);
          });
        });

        init();
        inputEl.focus();
      })();
    </script>
  </body>
</html>
