name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # `secrets` cannot appear in a step `if:` expression (the workflow file
    # fails parsing), so expose it through `env` first.
    env:
      DCORE_REPO_TOKEN: ${{ secrets.DCORE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Debug secret hash
        run: |
          echo "secret sha256: $(echo -n "$DCORE_REPO_TOKEN" | sha256sum | cut -d' ' -f1)"
        env:
          DCORE_REPO_TOKEN: ${{ secrets.DCORE_REPO_TOKEN }}



      # DCore is private: cross-repository protocol assertions run only when
      # the repo owner configures a DCORE_REPO_TOKEN secret (a fine-grained
      # PAT with read access to naka507/DCore). Without it, check:protocol
      # still runs the DCode-side assertions and warns about the skip.
      - name: Check out DCore
        if: env.DCORE_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: naka507/DCore
          token: secrets.DCORE_REPO_TOKEN
          path: dcore

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:unit
      - run: node scripts/check-architecture.mjs
      - run: node scripts/check-agent-policy-sync.mjs
      - run: npm run check:protocol
        env:
          DCORE_REPO: ${{ github.workspace }}/dcore


